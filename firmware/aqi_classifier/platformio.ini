; Stage 2: AQI classifier - ESP32-S3-DevKitC-1 (N16R8)
; Board settings match the bench project that runs on this exact board.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The cable goes in the UART USB-C port (CH343 bridge). CDC_ON_BOOT=0 sends
; Serial to UART0, which is what that port carries.
build_flags =
    -I${PROJECT_DIR}          ; aqi_model.h lives in the project root, where train_mlp.py writes it
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Code review 2026-11-03: single-rounding requantization, as TF 2.21 uses, so the board's integer
    ; kernels give bit-identical outputs to the laptop reference (default gemmlowp double rounding
    ; differed on ~1,400 of 21,282 test rows). build_flags also apply to lib_deps: clean build after changing.
    -DTFLITE_SINGLE_ROUNDING=1
    ; no fused multiply-add, so float32 pre-processing rounds exactly like numpy on the laptop
    -ffp-contract=off
lib_deps =
    adafruit/RTClib@^2.1.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    duinowitchery/hd44780@^1.3.2
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
