; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Pin the port by hardware id. /dev/ttyACM0 vs ACM1 flips around on re-enumeration,
; which breaks uploads with "port is busy or doesn't exist". This symlink is stable.
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B8F093666-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B8F093666-if00
; CDC_ON_BOOT=0 -> Serial is UART0 (GPIO 43/44), which routes through the
; board's CH343 USB-UART bridge chip (usb id 1a86:55d3).
;
; The DevKitC-1 has TWO USB-C ports. We are plugged into the *UART* port, not
; the native-USB port. With CDC_ON_BOOT=1, Serial goes out the NATIVE USB port
; -- which has no cable in it -- so every Serial.print() vanished while the
; ROM banner and ESP-IDF logs (which use UART0) still arrived. That cost hours.
;
; If you ever move the cable to the native USB port, set this back to 1.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    adafruit/Adafruit INA219
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    adafruit/RTClib
    duinowitchery/hd44780